<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghost Chat — redirecting…</title>
<!--
  Ghost Chat lives at ONE canonical URL now (the Render host, which serves the
  frontend AND the WebSocket backend from the same origin). This GitHub Pages
  site just forwards there. Keeping a single origin avoids the split-cache /
  cross-origin-WebSocket problems that made the old Pages copy unreliable.
-->
<script>
  (function () {
    var TARGET = 'https://ghost-chat-5gxc.onrender.com/';
    // Preserve ?join=CODE invite links (and any hash) across the redirect.
    var dest = TARGET + (location.search || '') + (location.hash || '');
    // Best-effort cleanup of the OLD Pages service worker + caches so a stale
    // app shell from this origin can never be served again.
    try {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          for (var i = 0; i < regs.length; i++) { try { regs[i].unregister(); } catch (e) {} }
        }).catch(function () {});
      }
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) {
          for (var i = 0; i < keys.length; i++) { try { caches.delete(keys[i]); } catch (e) {} }
        }).catch(function () {});
      }
    } catch (e) {}
    // Go. replace() (not assign) so the back button doesn't bounce here.
    try { location.replace(dest); } catch (e) { location.href = dest; }
  })();
</script>
<!-- Fallback for the rare no-JS case (does not carry the query string). -->
<meta http-equiv="refresh" content="0; url=https://ghost-chat-5gxc.onrender.com/">
<link rel="canonical" href="https://ghost-chat-5gxc.onrender.com/">
</head>
<body style="margin:0;background:#16181d;color:#e6e6ef;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <div style="max-width:32rem;margin:0 auto;padding:20vh 1.5rem 0;text-align:center">
    <div style="font-size:2.5rem;line-height:1">👻</div>
    <h1 style="font-size:1.25rem;margin:.75rem 0 .25rem">Ghost Chat has moved</h1>
    <p style="opacity:.7;margin:0 0 1rem">Taking you to the app…</p>
    <p style="margin:0">
      <a href="https://ghost-chat-5gxc.onrender.com/" style="color:#a78bfa">Open Ghost Chat</a>
    </p>
  </div>
</body>
</html>
