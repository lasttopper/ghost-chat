# Publishes a REDIRECTOR to GitHub Pages.
#
# The Ghost Chat app now lives at ONE canonical origin — the Render host, which
# serves the frontend AND the WebSocket backend together. Serving the app from
# a separate static origin (Pages) caused cross-origin WebSocket + split service
# -worker cache problems (the "stuck on connecting…" symptom). So Pages just
# forwards to Render now; the real app is no longer deployed here.
#
# The redirect page (pages-redirect/index.html) preserves ?join= invite links
# and unregisters the old Pages service worker so no stale shell lingers.

name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
