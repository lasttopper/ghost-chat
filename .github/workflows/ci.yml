name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Start Firebase Auth emulator (background)
        run: npm run emulators > emulator.log 2>&1 &

      - name: Wait for Auth emulator on :9099
        run: |
          for i in $(seq 1 120); do
            if (exec 3<>/dev/tcp/127.0.0.1/9099) 2>/dev/null; then
              echo "emulator up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Auth emulator did not start"
          cat emulator.log
          exit 1

      - name: Run full test suite (standalone + vercel + digest + firebase)
        run: npm test
