# Builds the Ghost Chat Android APK — a Trusted Web Activity (TWA) wrapping
# the GitHub Pages frontend, so the Web Notifications API works natively.
#
# Runs on GitHub's ubuntu runners (JDK + Android SDK preinstalled).
# Trigger: manual (Actions tab → "Build Android APK") or on v* tags.
#
# Host resolution (deep links + TWA origin): uses the APP_URL repo variable
# (currently the Render backend, which also serves the frontend), then
# PAGES_URL, else https://<owner>.github.io/<repo>. The chosen host must
# serve /.well-known/assetlinks.json (see public/.well-known/) so verified
# App Links deep-link into the APK; when the APK isn't installed the same
# links fall back to the web app in the browser.
#
# Signing: uses the TWA_KEYSTORE_BASE64 secret (+ TWA_KEYSTORE_PASSWORD /
# TWA_KEY_PASSWORD) when present — REQUIRED for stable deep links (the
# assetlinks fingerprint must match the signing key). Otherwise generates a
# throwaway keystore (each run then needs uninstall-before-reinstall and
# deep links will NOT verify).

name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # publish the APK to a GitHub Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve app host
        id: pages
        run: |
          URL="${{ vars.APP_URL }}"
          if [ -z "$URL" ]; then URL="${{ vars.PAGES_URL }}"; fi
          if [ -z "$URL" ]; then
            URL="https://$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z').github.io/$(echo '${{ github.event.repository.name }}' | tr 'A-Z' 'a-z')"
          fi
          HOST=$(echo "$URL" | sed -E 's#^https?://##; s#/$##')
          BASE_PATH=$(echo "$URL" | sed -E 's#^https?://[^/]+##; s#/$##')
          if [ -z "$BASE_PATH" ] || [ "$BASE_PATH" = "/" ]; then
            echo "start_url=/" >> "$GITHUB_OUTPUT"
          else
            echo "start_url=$BASE_PATH/" >> "$GITHUB_OUTPUT"
          fi
          echo "host=$HOST" >> "$GITHUB_OUTPUT"

      - name: Inject Pages host into TWA manifest
        run: |
          sed -i "s|PAGES_HOST|${{ steps.pages.outputs.host }}|g" twa/twa-manifest.json
          sed -i "s|\"startUrl\": \"/\"|\"startUrl\": \"${{ steps.pages.outputs.start_url }}\"|" twa/twa-manifest.json
          cat twa/twa-manifest.json

      - name: Prepare signing keystore
        run: |
          cd twa
          if [ -n "${{ secrets.TWA_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.TWA_KEYSTORE_BASE64 }}" | base64 -d > android.keystore
          else
            keytool -genkeypair -v \
              -keystore android.keystore -alias android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass ghostchat -keypass ghostchat \
              -dname "CN=Ghost Chat, OU=Dev, O=Ghost, L=NA, S=NA, C=IN"
          fi

      - name: Install Bubblewrap
        run: npm i -g @bubblewrap/cli

      - name: Point Bubblewrap at runner JDK + Android SDK (non-interactive)
        run: |
          # updateConfig prompts interactively and hangs on CI — write the
          # same config file it would produce.
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"

      - name: Link cmdline-tools so Bubblewrap validates the SDK
        run: |
          # Bubblewrap requires <sdk>/tools or <sdk>/bin; runner images keep
          # the tools in cmdline-tools/latest. Symlink so validatePath passes
          # and sdkmanager is found at <sdk>/tools/bin/sdkmanager.
          ln -sfn "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"

      - name: Generate Android project and build APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD || 'ghostchat' }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.TWA_KEY_PASSWORD || 'ghostchat' }}
        run: |
          cd twa
          bubblewrap update --skipVersionUpgrade
          bubblewrap build --skipPwaValidation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ghost-chat-apk
          path: |
            twa/app-release-signed.apk
            twa/app-release-bundle.aab
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd twa
          # stable asset names — the web download button points at
          # /releases/latest/download/ghost-chat.apk
          cp app-release-signed.apk ghost-chat.apk
          cp app-release-bundle.aab ghost-chat.aab
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v*) ;; *) TAG="v1.0.0" ;; esac
          gh release create "$TAG" \
            --title "Ghost Chat $TAG" \
            --notes "Ghost Chat for Android (TWA). Invite links on ghost-chat-5gxc.onrender.com deep-link into the app; when it isn't installed they fall back to the web app." \
            --target "$GITHUB_SHA" --latest || true
          gh release upload "$TAG" ghost-chat.apk ghost-chat.aab --clobber --latest
