name: Build Android (WebView + screenshot detection)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 34 + build-tools
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true
      - run: yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Bump versionCode (unique per build)
        working-directory: android
        run: |
          VC=$((1000 + GITHUB_RUN_NUMBER))
          sed -i "s/versionCode [0-9]\+/versionCode $VC/" app/build.gradle
          echo "versionCode -> $VC"

      - name: Prepare signing keystore
        run: |
          # Decode the SAME keystore the TWA release was signed with, so this
          # WebView build is an update to the same app (matching signature).
          mkdir -p twa
          if [ -n "${{ secrets.TWA_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.TWA_KEYSTORE_BASE64 }}" | base64 -d > twa/android.keystore
            echo "Keystore restored from TWA_KEYSTORE_BASE64 ($(wc -c < twa/android.keystore) bytes)"
          else
            echo "::error::TWA_KEYSTORE_BASE64 secret is not set - cannot sign with the release key."
            exit 1
          fi

      - name: Build signed release APK + AAB
        working-directory: android
        env:
          GHOST_KEYSTORE_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          GHOST_KEY_PASSWORD: ${{ secrets.TWA_KEY_PASSWORD }}
        run: |
          gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload APK + AAB
        uses: actions/upload-artifact@v4
        with:
          name: ghost-chat-android-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
