plugins {
    id 'com.android.application'
}

android {
    namespace 'chat.ghost.app'
    compileSdk 34

    defaultConfig {
        applicationId "chat.ghost.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.1.0"
    }

    signingConfigs {
        release {
            // Reuse the existing keystore so this stays an update to the same app.
            storeFile file("../../twa/android.keystore")
            storePassword System.getenv("GHOST_KEYSTORE_PASSWORD") ?: "ghostchat"
            keyAlias "android"
            keyPassword System.getenv("GHOST_KEY_PASSWORD") ?: "ghostchat"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Intentionally empty: the app uses only the Android framework (WebView,
    // ContentObserver, NotificationManager). No AndroidX, no third-party deps.
}
