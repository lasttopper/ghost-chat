plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'chat.ghost.app'
    compileSdk 34

    defaultConfig {
        applicationId "chat.ghost.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.3.0"
    }

    signingConfigs {
        release {
            // Reuse the existing keystore so this stays an update to the same app.
            storeFile file("../../twa/android.keystore")
            storePassword System.getenv("GHOST_KEYSTORE_PASSWORD") ?: "ghostchat"
            keyAlias "android"
            keyPassword System.getenv("GHOST_KEY_PASSWORD") ?: "ghostchat"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Native Google Sign-In: Credential Manager (the modern Google flow) +
    // Firebase Auth (holds the native session; the WebView gets real Firebase
    // ID tokens from it through the JS bridge).
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
